name: Epovox — control de salud (semanal) + card manual

# Programado: SOLO control de salud, 1 vez por semana (domingos 09:00 ART / 12:00 UTC).
# Ya no se sube un cuento por día — el foco pasó a tráfico y suscriptores.
# La carga de un cuento solo corre si se dispara a mano (workflow_dispatch).
on:
  schedule:
    - cron: "0 12 * * 0"
  workflow_dispatch:

jobs:
  epovox:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del repo
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Instalar dependencias
        run: npm ci

      - name: Crear .env.local desde los Secrets
        run: |
          {
            echo "NEXT_PUBLIC_SUPABASE_URL=${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}"
            echo "SUPABASE_SERVICE_ROLE_KEY=${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}"
            echo "RESEND_API_KEY=${{ secrets.RESEND_API_KEY }}"
            echo "RESEND_FROM_EMAIL=${{ secrets.RESEND_FROM_EMAIL }}"
            echo "EPOVOX_ALERT_EMAIL=${{ secrets.EPOVOX_ALERT_EMAIL }}"
          } > .env.local

      # Solo si se dispara a mano (no en la corrida semanal automática).
      - name: Agregar 1 cuento (card — solo manual)
        if: github.event_name == 'workflow_dispatch'
        run: node scripts/daily-card.mjs

      - name: Control de salud auto-reparador
        if: always()   # corre siempre (semanal o manual)
        run: node scripts/health-check.mjs
